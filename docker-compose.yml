services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eval_tinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/eval_tinder
      ARTIFACT_PATH: /data/artifacts
    command: sh -c "uv run alembic upgrade head && uv run uvicorn eval_tinder.api.app:app --host 0.0.0.0 --port 8000"
    volumes:
      - artifacts:/data/artifacts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/eval_tinder
      ARTIFACT_PATH: /data/artifacts
    command: uv run eval-tinder worker
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
  artifacts:
