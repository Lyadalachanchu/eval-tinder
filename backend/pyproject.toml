[project]
name = "eval-tinder"
version = "0.1.0"
description = "Human-aligned evaluation of production traces with DSPy GEPA-evolved graders"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dspy==3.3.1",
    "gepa==0.1.4",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.41.0",
    "sqlalchemy==2.0.52",
    "alembic==1.19.2",
    "psycopg[binary]==3.3.5",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "scipy==1.17.1",
    "numpy>=2.2",
    "python-multipart==0.0.22",
    "orjson==3.11.7",
    "httpx==0.28.1",
    "typer==0.20.0",
]

[project.optional-dependencies]
benchmarks = [
    "pyarrow>=17",
]
dev = [
    "pytest==9.0.2",
    "pytest-timeout==2.4.0",
    "ruff==0.14.14",
]

[project.scripts]
eval-tinder = "eval_tinder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_tinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "real_gepa: opt-in test that runs the real DSPy GEPA optimizer (needs REAL_GEPA=1)",
    "real_model: opt-in smoke test that calls a real LLM provider (needs REAL_MODEL=1 and credentials)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
